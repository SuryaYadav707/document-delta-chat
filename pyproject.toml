[project]
name = "delta-chat"
version = "0.1.0"
description = "Document Delta & Grounded Chat — format-agnostic revision diff + cited chat"
requires-python = ">=3.10"

dependencies = [
  # --- orchestration / LLM framework ---
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langchain-chroma>=0.1",
  "langchain-community>=0.3",
  "chromadb>=0.5",

  # --- observability ---
  "langfuse>=2.0",
  "structlog>=24.1",

  # --- ingestion: native PDF ---
  "pymupdf>=1.24",          # fitz: text spans + bbox + vector drawings
  "pdfplumber>=0.11",       # table extraction

  # --- ingestion: scanned PDF (OCR) ---
  "pdf2image>=1.17",        # rasterize pages (needs poppler)
  "paddleocr>=2.7",         # primary OCR: angle-cls, word polygons + confidence
  "paddlepaddle>=2.6",      # paddleocr backend (heavy; see README for install notes)
  "opencv-python-headless>=4.9",  # deskew / threshold preprocessing

  # --- ingestion: DWG (real stub via DXF) ---
  "ezdxf>=1.3",

  # --- delta matching ---
  "rapidfuzz>=3.9",         # fast token-set text similarity
  "scipy>=1.13",            # linear_sum_assignment (Hungarian)
  "numpy>=1.26",

  # --- serving ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",   # file uploads from the UI

  # --- config / cli ---
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"
